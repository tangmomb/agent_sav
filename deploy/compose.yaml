# Démo publique : docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# Le port n'est ouvert qu'à la machine : Caddy (deploy/Caddyfile) publie le site en HTTPS.
name: agent-sav-demo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sav
      POSTGRES_USER: sav
      POSTGRES_PASSWORD: ${SAV_DB_PASSWORD:?mot de passe de la base à choisir}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sav -d sav"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  web:
    build: ..
    environment:
      DATABASE_URL: postgresql://sav:${SAV_DB_PASSWORD}@postgres:5432/sav
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?clé Mistral à fournir}
      SAV_DAILY_TOKENS: ${SAV_DAILY_TOKENS:-1500000}
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SAV_PORT:-8000}:8000"
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  postgres-data:
