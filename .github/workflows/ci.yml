# Contrôles de chaque push et de chaque PR : vraies erreurs Python, syntaxe du JavaScript, tests.
# Aucun appel au modèle : les tests le jouent, l'évaluation (evals/) se lance à la main.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sav
          POSTGRES_USER: sav
          POSTGRES_PASSWORD: sav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sav -d sav"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      SAV_TEST_DATABASE_URL: postgresql://sav:sav@127.0.0.1:5432/sav
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer
        run: pip install -r requirements-dev.txt

      - name: Vraies erreurs Python (noms non définis, imports inutiles, syntaxe)
        run: ruff check --select F,E9 .

      - name: Syntaxe du JavaScript
        run: |
          for file in agent_sav/boutique/*.js interface/*.js; do
            cp "$file" /tmp/check.mjs && node --check /tmp/check.mjs
          done

      - name: Tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build --tag agent-sav .
