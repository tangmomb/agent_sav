<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Retrouvez vos achats et contactez le service client de Maison Orme.">
  <title>Mes achats · Maison Orme</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/boutique.css">
  <script type="module" src="/achats.js"></script>
</head>
<body id="accueil">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="#accueil">Maison Orme<span>.</span></a>
      <div class="account">
        <label for="customer">Compte de démo</label>
        <select id="customer" disabled><option>Chargement…</option></select>
      </div>
    </div>
  </header>

  <main class="shell">
    <p class="breadcrumb">Mon compte <span aria-hidden="true">/</span> Mes achats</p>
    <nav class="sav-nav" aria-label="Démonstration SAV">
      <a id="sav-mail" href="/sav/mail/CLI-001">Boîte mail de démonstration</a>
      <a href="/boutique/sav">Espace boutique</a>
    </nav>
    <div class="order-heading">
      <h1>Mes achats</h1>
      <p id="orders-status" role="status">Chargement de vos commandes…</p>
    </div>
    <button class="contact" id="retry-orders" type="button" hidden>Réessayer</button>
    <ul id="orders" class="orders" aria-label="Historique des commandes"></ul>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span class="wordmark">Maison Orme<span>.</span></span>
      <span>Boutique fictive</span>
    </div>
  </footer>

  <div class="chat">
    <section id="chat-panel" class="chat-panel" aria-labelledby="chat-title" hidden>
      <header class="chat-header">
        <span class="chat-avatar" aria-hidden="true">O.</span>
        <div class="chat-heading">
          <h2 id="chat-title">Service client</h2>
          <p id="chat-order"></p>
        </div>
        <button id="close-chat" class="icon-button" type="button" aria-label="Fermer le chat">×</button>
      </header>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <div id="chat-actions" class="chat-actions" aria-label="Réponses rapides"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" aria-label="Votre message" placeholder="Écrivez votre message…" maxlength="1000" autocomplete="off" required>
        <button id="send-chat" class="send-button" type="submit" aria-label="Envoyer">
          <span aria-hidden="true">↑</span>
        </button>
      </form>
    </section>
  </div>
  <template id="order-card">
    <li class="order-card">
      <div class="order-meta">
        <p>Commande <strong class="order-id"></strong><span class="separator" aria-hidden="true">·</span><time></time></p>
        <span class="order-state"></span>
      </div>
      <ul class="order-items" aria-label="Articles de la commande"></ul>
      <div class="order-summary">
        <p>Total <strong class="order-total price"></strong></p>
        <button class="contact" type="button" aria-controls="chat-panel" aria-expanded="false">Contacter le SAV</button>
      </div>
    </li>
  </template>
  <template id="order-item">
    <li class="order-item">
      <div>
        <strong class="product-name"></strong>
        <p class="variant"></p>
      </div>
      <span class="price"></span>
    </li>
  </template>
</body>
</html>
