services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sav
      POSTGRES_USER: sav
      POSTGRES_PASSWORD: sav
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sav -d sav"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
